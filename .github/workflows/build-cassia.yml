name: Build Cassia APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT CASSIAPP
      # ============================================================

      - name: Checkout CassiApp
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ============================================================
      # 2. JAVA 19
      # ============================================================

      - name: Setup Java 19
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'
          cache: gradle

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

          yes | sdkmanager --licenses || true

      # ============================================================
      # 4. BUILD DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ninja-build \
            autoconf \
            automake \
            libtool \
            pkg-config \
            meson \
            jq \
            gettext \
            autopoint \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel

      # ============================================================
      # 5. ANDROID ENVIRONMENT
      # ============================================================

      - name: Configure Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 6. CLONE CASSIAEXT
      # ============================================================

      - name: Clone CassiaExt
        run: |
          git clone --depth 1 \
            https://github.com/cassia-org/cassiaext.git \
            "$GITHUB_WORKSPACE/cassiaext"

      # ============================================================
      # 7. INSPECT CASSIAEXT
      # ============================================================

      - name: Inspect CassiaExt
        working-directory: cassiaext
        run: |
          echo "=========================================="
          echo "CASSIAEXT ROOT"
          echo "=========================================="

          ls -la

          echo ""
          echo "=========================================="
          echo "FILES"
          echo "=========================================="

          find . -maxdepth 3 -type f | sort

          echo ""
          echo "=========================================="
          echo "DIRECTORIES"
          echo "=========================================="

          find . -maxdepth 2 -type d | sort

          echo ""
          echo "=========================================="
          echo "SHELL SCRIPTS"
          echo "=========================================="

          find . -type f -name "*.sh" -print

      # ============================================================
      # 8. FIND PATCH SCRIPT
      # ============================================================

      - name: Find CassiaExt patch script
        working-directory: cassiaext
        run: |
          PATCH_SCRIPT=$(find . -type f \
            \( -name "apply-patches.sh" -o -name "apply_patches.sh" \) \
            -print -quit)

          if [ -z "$PATCH_SCRIPT" ]; then
            echo "WARNING: apply-patches.sh was not found."
            echo "Continuing without patch script."
          else
            echo "Found patch script:"
            echo "$PATCH_SCRIPT"

            chmod +x "$PATCH_SCRIPT"
            "$PATCH_SCRIPT"
          fi

      # ============================================================
      # 9. BUILD CASSIAEXT
      # ============================================================
      #
      # This step will be adjusted after seeing the real
      # CassiaExt structure from the inspection above.
      #
      # ============================================================

      - name: Configure CassiaExt
        working-directory: cassiaext
        run: |
          cmake \
            -GNinja \
            -Bbuild \
            -H. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_SDK="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK="$ANDROID_NDK_HOME"

      - name: Build CassiaExt
        working-directory: cassiaext
        run: |
          cmake --build build --parallel 2

      # ============================================================
      # 10. LOCATE PREFIX.TAR.GZ
      # ============================================================

      - name: Locate CassiaExt prefix
        run: |
          echo "Searching for prefix.tar.gz..."

          find "$GITHUB_WORKSPACE/cassiaext" \
            -name "prefix.tar.gz" \
            -type f \
            -print

      # ============================================================
      # 11. CREATE CASSIAEXT.CFG
      # ============================================================

      - name: Create cassiaext.cfg
        run: |
          PREFIX_FILE=$(find "$GITHUB_WORKSPACE/cassiaext" \
            -name "prefix.tar.gz" \
            -type f \
            -print -quit)

          if [ -z "$PREFIX_FILE" ]; then
            echo "ERROR: prefix.tar.gz was not generated."
            exit 1
          fi

          CASSIAEXT_DIR=$(dirname "$PREFIX_FILE")

          echo "CassiaExt build directory:"
          echo "$CASSIAEXT_DIR"

          printf '%s\n' "$CASSIAEXT_DIR" > cassiaext.cfg
          printf '\n' >> cassiaext.cfg

          echo ""
          echo "Generated cassiaext.cfg:"
          cat cassiaext.cfg

      # ============================================================
      # 12. GRADLE PERMISSION
      # ============================================================

      - name: Grant Gradle permission
        run: |
          chmod +x gradlew

      # ============================================================
      # 13. BUILD CASSIA DEBUG APK
      # ============================================================

      - name: Build Debug APK
        run: |
          ./gradlew \
            assembleDebug \
            --stacktrace \
            --no-daemon \
            --info

      # ============================================================
      # 14. LOCATE APK
      # ============================================================

      - name: Locate APK
        run: |
          echo "Generated APK files:"

          find . \
            -path "*/build/outputs/apk/*.apk" \
            -type f \
            -print

      # ============================================================
      # 15. UPLOAD APK
      # ============================================================

      - name: Upload Cassia APK
        uses: actions/upload-artifact@v4
        with:
          name: Cassia-arm64-debug
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
