name: Build Cassia APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT CASSIAPP
      # ============================================================

      - name: Checkout CassiApp
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # ============================================================
      # 2. JAVA 19
      # ============================================================

      - name: Setup Java 19
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'
          cache: gradle

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

          yes | sdkmanager --licenses || true

      # ============================================================
      # 4. BUILD DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ninja-build \
            autoconf \
            automake \
            libtool \
            pkg-config \
            meson \
            jq \
            gettext \
            autopoint \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel

      # ============================================================
      # 5. ANDROID ENVIRONMENT
      # ============================================================

      - name: Configure Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 6. CLONE CASSIAEXT
      # ============================================================

      - name: Clone CassiaExt
        run: |
          git clone \
            --depth 1 \
            https://github.com/cassia-org/cassiaext.git \
            "$GITHUB_WORKSPACE/cassiaext"

      # ============================================================
      # 7. CONFIGURE GIT TO USE HTTPS INSTEAD OF SSH
      # ============================================================

      - name: Configure GitHub HTTPS
        working-directory: cassiaext
        run: |
          echo "Converting GitHub SSH URLs to HTTPS..."

          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git://github.com/"

          git submodule sync --recursive

          echo ""
          echo "Configured Git URL rewrite rules:"
          git config --global --get-regexp '^url\..*\.insteadOf$' || true

      # ============================================================
      # 8. INITIALIZE CASSIAEXT SUBMODULES
      # ============================================================

      - name: Initialize CassiaExt submodules
        working-directory: cassiaext
        run: |
          echo "Initializing CassiaExt submodules..."

          git submodule update \
            --init \
            --recursive \
            --depth 1

          echo ""
          echo "=========================================="
          echo "SUBMODULE STATUS"
          echo "=========================================="

          git submodule status --recursive

      # ============================================================
      # 9. VERIFY IMPORTANT DEPENDENCIES
      # ============================================================

      - name: Verify CassiaExt dependencies
        working-directory: cassiaext
        run: |
          echo "=========================================="
          echo "VERIFYING DEPENDENCIES"
          echo "=========================================="

          FAILED=0

          for dir in \
            deps/libandroid-shmem \
            deps/xcbproto \
            deps/xorgproto \
            deps/libxau \
            deps/libxcb \
            deps/libx11 \
            deps/libffi \
            deps/libexpat \
            deps/wayland \
            deps/wayland-protocols \
            deps/libxfixes \
            deps/libxdamage \
            deps/libxcomposite \
            deps/libxrender \
            deps/libxcursor \
            deps/libxext \
            deps/libxxf86vm \
            deps/libxi \
            deps/libxtst \
            deps/libxres \
            deps/libxtrans \
            deps/libice \
            deps/libsm \
            deps/libxt \
            deps/libxmu
          do
            if [ -d "$dir" ] && [ "$(find "$dir" -mindepth 1 -maxdepth 1 | head -1)" ]; then
              echo "[OK] $dir"
            else
              echo "[MISSING OR EMPTY] $dir"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "ERROR: One or more CassiaExt dependencies are missing."
            exit 1
          fi

      # ============================================================
      # 10. FIND AND APPLY PATCHES
      # ============================================================

      - name: Find and apply CassiaExt patches
        working-directory: cassiaext
        run: |
          PATCH_SCRIPT=$(find . \
            -type f \
            \( \
              -name "apply-patches.sh" \
              -o \
              -name "apply_patches.sh" \
            \) \
            -print \
            -quit)

          if [ -z "$PATCH_SCRIPT" ]; then
            echo "No patch script found."
            echo "Continuing without patch script."
          else
            echo "Found patch script:"
            echo "$PATCH_SCRIPT"

            chmod +x "$PATCH_SCRIPT"

            "$PATCH_SCRIPT"
          fi

      # ============================================================
      # 11. VERIFY CASSIAEXT
      # ============================================================

      - name: Verify CassiaExt tree
        working-directory: cassiaext
        run: |
          echo "=========================================="
          echo "CASSIAEXT ROOT"
          echo "=========================================="

          ls -la

          echo ""
          echo "=========================================="
          echo "DEPS"
          echo "=========================================="

          ls -la deps

      # ============================================================
      # 12. CONFIGURE CASSIAEXT
      # ============================================================

      - name: Configure CassiaExt
        working-directory: cassiaext
        run: |
          rm -rf build

          cmake \
            -GNinja \
            -Bbuild \
            -H. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_SDK="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK="$ANDROID_NDK_HOME"

      # ============================================================
      # 13. BUILD CASSIAEXT
      # ============================================================

      - name: Build CassiaExt
        working-directory: cassiaext
        run: |
          cmake \
            --build build \
            --parallel 2

      # ============================================================
      # 14. LOCATE PREFIX.TAR.GZ
      # ============================================================

      - name: Locate CassiaExt prefix
        run: |
          echo "Searching for prefix.tar.gz..."

          find "$GITHUB_WORKSPACE/cassiaext" \
            -name "prefix.tar.gz" \
            -type f \
            -print

      # ============================================================
      # 15. CREATE CASSIAEXT.CFG
      # ============================================================

      - name: Create cassiaext.cfg
        run: |
          PREFIX_FILE=$(find "$GITHUB_WORKSPACE/cassiaext" \
            -name "prefix.tar.gz" \
            -type f \
            -print \
            -quit)

          if [ -z "$PREFIX_FILE" ]; then
            echo "ERROR: prefix.tar.gz was not generated."

            echo ""
            echo "Searching build tree:"
            find "$GITHUB_WORKSPACE/cassiaext/build" \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          CASSIAEXT_DIR=$(dirname "$PREFIX_FILE")

          echo "=========================================="
          echo "CASSIAEXT BUILD DIRECTORY"
          echo "=========================================="

          echo "$CASSIAEXT_DIR"

          printf '%s\n' "$CASSIAEXT_DIR" > cassiaext.cfg
          printf '\n' >> cassiaext.cfg

          echo ""
          echo "=========================================="
          echo "GENERATED cassiaext.cfg"
          echo "=========================================="

          cat cassiaext.cfg

      # ============================================================
      # 16. GRADLE PERMISSION
      # ============================================================

      - name: Grant Gradle permission
        run: |
          chmod +x gradlew

      # ============================================================
      # 17. BUILD CASSIA DEBUG APK
      # ============================================================

      - name: Build Debug APK
        run: |
          ./gradlew \
            assembleDebug \
            --stacktrace \
            --no-daemon \
            --info

      # ============================================================
      # 18. LOCATE APK
      # ============================================================

      - name: Locate APK
        run: |
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          find . \
            -path "*/build/outputs/apk/*.apk" \
            -type f \
            -print

      # ============================================================
      # 19. UPLOAD APK
      # ============================================================

      - name: Upload Cassia APK
        uses: actions/upload-artifact@v4
        with:
          name: Cassia-arm64-debug
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
