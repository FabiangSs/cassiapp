name: Build Cassia APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Cassia ARM64 APK
    runs-on: ubuntu-24.04

    env:
      ANDROID_NDK_VERSION: "26.1.10909125"
      CMAKE_VERSION: "3.22.1"
      JAVA_VERSION: "19"

    steps:

      # ============================================================
      # 1. CHECKOUT PRINCIPAL
      # ============================================================

      - name: Checkout Cassia
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # ============================================================
      # 2. JAVA 19
      # ============================================================

      - name: Setup Java 19
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "19"

      # ============================================================
      # 3. ANDROID SDK / NDK / CMAKE / NINJA
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      # ============================================================
      # 4. HERRAMIENTAS NATIVAS
      # ============================================================

      - name: Install native build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ninja-build \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gettext \
            meson \
            python3 \
            python3-pip \
            build-essential \
            git

      # ============================================================
      # 5. CONFIGURAR VARIABLES ANDROID
      # ============================================================

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      # ============================================================
      # 6. CONVERTIR SUBMODULES SSH -> HTTPS
      #
      # Esto es CRÍTICO.
      # CassiaExt contiene:
      #
      # gamescope -> git@github.com:ValveSoftware/gamescope.git
      # xserver   -> git@github.com:cassia-org/xserver.git
      #
      # Actions no tiene SSH keys para ellos.
      # ============================================================

      - name: Convert Git submodules from SSH to HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git://github.com/"

          git config --global protocol.version 2

          echo "Git URL rewrite configuration:"
          git config --global --get-regexp '^url\..*\.insteadOf$' || true

      # ============================================================
      # 7. INICIALIZAR SUBMÓDULOS
      # ============================================================

      - name: Initialize Cassia submodules
        run: |
          git submodule sync --recursive

          git submodule update --init --recursive --jobs 4

      # ============================================================
      # 8. FORZAR HTTPS EN LOS .gitmodules DE CASSIAEXT
      #
      # Algunas referencias pueden seguir apareciendo como SSH.
      # ============================================================

      - name: Fix CassiaExt submodule URLs
        run: |
          if [ -d "cassiaext" ]; then
            cd cassiaext

            git config -f .gitmodules url."https://github.com/".insteadOf "git@github.com:"
            git config -f .gitmodules url."https://github.com/".insteadOf "ssh://git@github.com/"

            git submodule sync --recursive
          fi

      # ============================================================
      # 9. REINTENTAR SUBMÓDULOS DE CASSIAEXT
      # ============================================================

      - name: Initialize CassiaExt submodules
        run: |
          if [ -d "cassiaext" ]; then
            git -C cassiaext submodule sync --recursive

            git -C cassiaext submodule update \
              --init \
              --recursive \
              --jobs 4
          fi

      # ============================================================
      # 10. VERIFICAR ESTRUCTURA
      # ============================================================

      - name: Verify CassiaExt dependencies
        run: |
          echo "========================================"
          echo "CassiaExt directory"
          echo "========================================"

          ls -la cassiaext || true

          echo
          echo "========================================"
          echo "CassiaExt dependencies"
          echo "========================================"

          find cassiaext/deps \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -print \
            | sort

          echo
          echo "========================================"
          echo "Checking important dependencies"
          echo "========================================"

          for dir in \
            libandroid-shmem \
            xcbproto \
            xorgproto \
            libxau \
            libxcb \
            libx11 \
            libffi \
            libexpat \
            wayland \
            wayland-protocols \
            libxfixes \
            libxdamage \
            libxcomposite \
            libxrender \
            libxcursor \
            libxext \
            libxxf86vm \
            libxi \
            libxtst \
            libxres \
            libxtrans \
            libice \
            libsm \
            libxt \
            libxmu
          do
            if [ -d "cassiaext/deps/$dir" ] && [ "$(find "cassiaext/deps/$dir" -mindepth 1 -maxdepth 1 | head -n 1)" ]; then
              echo "OK: $dir"
            else
              echo "MISSING/EMPTY: $dir"
            fi
          done

          echo
          echo "========================================"
          echo "Gamescope"
          echo "========================================"

          if [ -d "cassiaext/gamescope" ] && [ "$(find cassiaext/gamescope -mindepth 1 -maxdepth 1 | head -n 1)" ]; then
            echo "OK: gamescope"
          else
            echo "MISSING/EMPTY: gamescope"
          fi

          echo
          echo "========================================"
          echo "XServer"
          echo "========================================"

          if [ -d "cassiaext/xserver" ] && [ "$(find cassiaext/xserver -mindepth 1 -maxdepth 1 | head -n 1)" ]; then
            echo "OK: xserver"
          else
            echo "MISSING/EMPTY: xserver"
          fi

      # ============================================================
      # 11. CONFIGURAR CMAKE
      # ============================================================

      - name: Configure CassiaExt with CMake
        run: |
          cmake \
            -GNinja \
            -B build \
            -H cassiaext \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_SDK="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK="$ANDROID_NDK_HOME"

      # ============================================================
      # 12. BUILD CASSIAEXT
      # ============================================================

      - name: Build CassiaExt
        run: |
          cmake --build build --parallel 2

      # ============================================================
      # 13. MOSTRAR RESULTADO CASSIAEXT
      # ============================================================

      - name: Locate CassiaExt output
        run: |
          echo "Searching for CassiaExt artifacts..."

          find cassiaext build \
            -type f \
            \( \
              -name "*.tar.gz" \
              -o -name "*.so" \
              -o -name "*.a" \
            \) \
            -print \
            2>/dev/null \
            | sort

      # ============================================================
      # 14. CREAR cassiaext.cfg
      # ============================================================

      - name: Create cassiaext.cfg
        run: |
          if [ -f cassiaext.cfg ]; then
            echo "cassiaext.cfg already exists."
            cat cassiaext.cfg
          else
            echo "ERROR: cassiaext.cfg is missing."
            exit 1
          fi

      # ============================================================
      # 15. GRADLE PERMISSIONS
      # ============================================================

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew

      # ============================================================
      # 16. BUILD DEBUG APK
      # ============================================================

      - name: Build Debug APK
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 17. BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # ============================================================
      # 18. LISTAR APKs
      # ============================================================

      - name: Locate APK files
        run: |
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            | sort

      # ============================================================
      # 19. SUBIR APKs COMO ARTIFACTS
      # ============================================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cassia-debug-arm64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Cassia-release-arm64
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
