name: Build Cassia APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Cassia ARM64 APK
    runs-on: ubuntu-24.04

    env:
      ANDROID_NDK_VERSION: "26.1.10909125"
      CMAKE_VERSION: "3.22.1"
      JAVA_VERSION: "19"

    steps:

      # ============================================================
      # 1. CHECKOUT PRINCIPAL
      # ============================================================

      - name: Checkout Cassia
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # ============================================================
      # 2. JAVA 19
      # ============================================================

      - name: Setup Java 19
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "19"

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      # ============================================================
      # 4. HERRAMIENTAS NATIVAS
      # ============================================================

      - name: Install native build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ninja-build \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gettext \
            meson \
            python3 \
            python3-pip \
            build-essential \
            git

      # ============================================================
      # 5. CONFIGURAR VARIABLES ANDROID
      # ============================================================

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"

      # ============================================================
      # 6. CONVERTIR GIT SSH -> HTTPS
      # ============================================================

      - name: Configure Git HTTPS for submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git://github.com/"

          git config --global protocol.version 2

          echo "Git URL rewrite rules:"
          git config --global --get-regexp '^url\..*\.insteadOf$' || true

      # ============================================================
      # 7. INICIALIZAR SUBMÓDULOS PRINCIPALES
      # ============================================================

      - name: Initialize Cassia submodules
        run: |
          git submodule sync --recursive

          git submodule update \
            --init \
            --recursive \
            --jobs 4

      # ============================================================
      # 8. CORREGIR URLS DE SUBMÓDULOS DE CASSIAEXT
      # ============================================================

      - name: Configure CassiaExt submodules
        run: |
          if [ ! -d "cassiaext" ]; then
            echo "ERROR: cassiaext directory does not exist."
            echo
            echo "Repository structure:"
            find . -maxdepth 3 -type d | sort
            exit 1
          fi

          echo "CassiaExt found:"
          pwd
          ls -la cassiaext

          if [ -f "cassiaext/.gitmodules" ]; then
            echo
            echo "CassiaExt .gitmodules:"
            cat cassiaext/.gitmodules

            cd cassiaext

            git submodule sync --recursive

            cd ..
          else
            echo "WARNING: cassiaext/.gitmodules was not found."
          fi

      # ============================================================
      # 9. INICIALIZAR SUBMÓDULOS DE CASSIAEXT
      # ============================================================

      - name: Initialize CassiaExt submodules
        run: |
          if [ ! -d "cassiaext" ]; then
            echo "ERROR: cassiaext directory does not exist."
            exit 1
          fi

          git -C cassiaext submodule sync --recursive

          git -C cassiaext submodule update \
            --init \
            --recursive \
            --jobs 4

      # ============================================================
      # 10. VERIFICAR ESTRUCTURA DE CASSIAEXT
      # ============================================================

      - name: Verify CassiaExt structure
        run: |
          echo "============================================================"
          echo "CURRENT DIRECTORY"
          echo "============================================================"

          pwd

          echo
          echo "============================================================"
          echo "ROOT DIRECTORY"
          echo "============================================================"

          ls -la

          echo
          echo "============================================================"
          echo "CASSIAEXT DIRECTORY"
          echo "============================================================"

          if [ ! -d "cassiaext" ]; then
            echo "ERROR: cassiaext does not exist."
            exit 1
          fi

          ls -la cassiaext

          echo
          echo "============================================================"
          echo "CMAKE FILES"
          echo "============================================================"

          find . \
            -name "CMakeLists.txt" \
            -print \
            | sort

          echo
          echo "============================================================"
          echo "CASSIAEXT DEPENDENCIES"
          echo "============================================================"

          if [ -d "cassiaext/deps" ]; then
            find cassiaext/deps \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -print \
              | sort
          else
            echo "WARNING: cassiaext/deps does not exist."
          fi

          echo
          echo "============================================================"
          echo "GAMESCOPE"
          echo "============================================================"

          if [ -d "cassiaext/gamescope" ] && \
             [ "$(find cassiaext/gamescope -mindepth 1 -maxdepth 1 | head -n 1)" ]; then
            echo "OK: gamescope"
          else
            echo "MISSING/EMPTY: gamescope"
          fi

          echo
          echo "============================================================"
          echo "XSERVER"
          echo "============================================================"

          if [ -d "cassiaext/xserver" ] && \
             [ "$(find cassiaext/xserver -mindepth 1 -maxdepth 1 | head -n 1)" ]; then
            echo "OK: xserver"
          else
            echo "MISSING/EMPTY: xserver"
          fi

      # ============================================================
      # 11. VERIFICAR TOOLCHAIN ANDROID
      # ============================================================

      - name: Verify Android toolchain
        run: |
          echo "ANDROID SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "ANDROID NDK:"
          echo "$ANDROID_NDK_HOME"

          echo
          echo "NDK toolchain:"
          ls -la "$ANDROID_NDK_HOME/build/cmake/"

          echo
          echo "CMake:"
          cmake --version

          echo
          echo "Ninja:"
          ninja --version

      # ============================================================
      # 12. CONFIGURAR CASSIAEXT CON CMAKE
      #
      # IMPORTANTE:
      #
      # ANTES:
      #   -H cassiaext
      #
      # AHORA:
      #   -S cassiaext
      #
      # -S = source directory
      # -B = build directory
      # ============================================================

      - name: Configure CassiaExt with CMake
        run: |
          cmake \
            -S cassiaext \
            -B build/cassiaext \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_SDK="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK="$ANDROID_NDK_HOME"

      # ============================================================
      # 13. BUILD CASSIAEXT
      # ============================================================

      - name: Build CassiaExt
        run: |
          cmake \
            --build build/cassiaext \
            --parallel 2

      # ============================================================
      # 14. BUSCAR RESULTADOS DE CASSIAEXT
      # ============================================================

      - name: Locate CassiaExt output
        run: |
          echo "============================================================"
          echo "CASSIAEXT BUILD OUTPUT"
          echo "============================================================"

          find cassiaext build/cassiaext \
            -type f \
            \( \
              -name "*.tar.gz" \
              -o -name "*.so" \
              -o -name "*.a" \
            \) \
            -print \
            2>/dev/null \
            | sort

      # ============================================================
      # 15. VERIFICAR cassiaext.cfg
      # ============================================================

      - name: Verify cassiaext.cfg
        run: |
          if [ ! -f "cassiaext.cfg" ]; then
            echo "ERROR: cassiaext.cfg is missing."
            echo
            echo "Files in repository root:"
            ls -la
            exit 1
          fi

          echo "cassiaext.cfg found:"
          cat cassiaext.cfg

      # ============================================================
      # 16. PREPARAR GRADLE
      # ============================================================

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew

      # ============================================================
      # 17. LIMPIAR BUILD ANTERIOR
      # ============================================================

      - name: Clean Gradle build
        run: |
          ./gradlew \
            --no-daemon \
            clean

      # ============================================================
      # 18. BUILD DEBUG APK
      # ============================================================

      - name: Build Debug APK
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            assembleDebug

      # ============================================================
      # 19. BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            assembleRelease

      # ============================================================
      # 20. LOCALIZAR APKs
      # ============================================================

      - name: Locate APK files
        run: |
          echo "============================================================"
          echo "APK OUTPUT"
          echo "============================================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            | sort

      # ============================================================
      # 21. SUBIR DEBUG APK
      # ============================================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cassia-debug-arm64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ============================================================
      # 22. SUBIR RELEASE APK
      # ============================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Cassia-release-arm64
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
