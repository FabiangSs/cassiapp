name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Prepare configuration file
      run: |
        BUILD_DIR="${{ github.workspace }}/app"
        cp app/cassiaext.example.cfg app/cassiaext.cfg
        sed -i "s|<ABSOLUTE PATH TO CASSIAEXT BUILD DIRECTORY>|$BUILD_DIR|g" app/cassiaext.cfg
        sed -i '/^<OPTIONAL/d' app/cassiaext.cfg
        sed -i '/^Rename this/d' app/cassiaext.cfg
        sed -i '/^Remove the comments/d' app/cassiaext.cfg
        echo "--- Contenido final de cassiaext.cfg ---"
        cat app/cassiaext.cfg

    - name: Generate Ninja build files with CMake
      run: |
        cd app
        mkdir -p build_native
        cd build_native
        cmake -G Ninja ..

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
